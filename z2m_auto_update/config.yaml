name: Z2M Auto Update
version: 1.0.0
slug: z2m_auto_update
description: Queues Zigbee2MQTT OTA firmware updates so they run one at a time instead of flooding the network
url: https://github.com/parallax/z2m-auto-update
image: ghcr.io/parallax/z2m-auto-update
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
services:
  - mqtt:want
ingress: true
ingress_port: 8099
panel_icon: mdi:update
panel_title: Z2M Auto Update
options:
  base_topic: zigbee2mqtt
  concurrent_updates: 1
  update_window_start: ""
  update_window_end: ""
  include_battery: true
  allow: []
  deny: []
  max_attempts: 3
  retry_delay_minutes: 60
  start_timeout_seconds: 60
  stall_timeout_seconds: 900
  cooldown_seconds: 30
  check_interval_hours: 24
  check_spacing_seconds: 10
  ha_discovery: true
  log_level: info
schema:
  base_topic: str
  concurrent_updates: int(1,5)
  update_window_start: str?
  update_window_end: str?
  include_battery: bool
  allow:
    - str
  deny:
    - str
  max_attempts: int(1,10)
  retry_delay_minutes: int(0,1440)
  start_timeout_seconds: int(10,3600)
  stall_timeout_seconds: int(60,7200)
  cooldown_seconds: int(0,600)
  check_interval_hours: int(0,168)
  check_spacing_seconds: int(1,600)
  ha_discovery: bool
  ha_discovery_prefix: str?
  status_topic: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
  log_level: list(debug|info|warning|error)
