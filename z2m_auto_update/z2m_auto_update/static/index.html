<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z2M Auto Update</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #16a34a; --warn: #d97706; --err: #dc2626;
    --chip: #eef2ff; --chip-text: #3730a3; --row-hover: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e26; --text: #e6e8ee; --muted: #9aa3b2; --line: #2a2f3a;
      --accent: #3b82f6; --ok: #22c55e; --warn: #f59e0b; --err: #ef4444;
      --chip: #1e2a4a; --chip-text: #c7d2fe; --row-hover: #20242e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 10px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .pill { display: inline-block; white-space: nowrap; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--chip); color: var(--chip-text); }
  .pill.updating { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .pill.idle, .pill.queued { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.paused, .pill.waiting_for_window { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.offline, .pill.failed { background: color-mix(in srgb, var(--err) 18%, transparent); color: var(--err); }
  .pill.available { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .pill.unknown, .pill.skipped { background: var(--line); color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  button:hover { background: var(--row-hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.small { padding: 2px 8px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:hover td { background: var(--row-hover); }
  td.num { white-space: nowrap; }
  .muted { color: var(--muted); }
  .progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .progress > div { height: 100%; background: var(--accent); transition: width .5s; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .stat { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  .stat .v { font-size: 22px; font-weight: 600; }
  .stat .l { color: var(--muted); font-size: 12px; }
  input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); min-width: 220px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; max-height: 320px; overflow: auto; }
  .log div { padding: 2px 0; border-bottom: 1px solid var(--line); }
  .log .error { color: var(--err); } .log .warning { color: var(--warn); } .log .success { color: var(--ok); }
  .empty { color: var(--muted); padding: 8px 0; }
  .tablewrap { overflow-x: auto; }
  #error { display: none; background: color-mix(in srgb, var(--err) 15%, transparent); color: var(--err); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
  details summary { cursor: pointer; color: var(--muted); }
  @media (max-width: 700px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Z2M Auto Update <span id="status" class="pill">…</span></h1>
    <div class="actions">
      <button id="btn-pause" onclick="act('pause')">Pause</button>
      <button id="btn-resume" onclick="act('resume')">Resume</button>
      <button id="btn-run" class="primary" onclick="act('run_now')" title="Process the queue now, ignoring the update window">Run now</button>
      <button onclick="act('check_all')" title="Ask Zigbee2MQTT to check every device, one at a time">Check for updates</button>
      <button onclick="act('reset_failures')" title="Clear failure counts so devices that gave up are retried">Reset failures</button>
    </div>
  </header>
  <div id="error"></div>

  <section class="card">
    <div class="grid">
      <div class="stat"><div class="v" id="s-queue">–</div><div class="l">in queue</div></div>
      <div class="stat"><div class="v" id="s-available">–</div><div class="l">updates available</div></div>
      <div class="stat"><div class="v" id="s-devices">–</div><div class="l">OTA-capable devices</div></div>
      <div class="stat"><div class="v" id="s-checks">–</div><div class="l">checks pending</div></div>
      <div class="stat"><div class="v" id="s-window">–</div><div class="l">update window</div></div>
    </div>
    <p id="note" class="muted" style="margin:10px 0 0"></p>
  </section>

  <section class="card" id="active-card">
    <h2>Now updating</h2>
    <div id="active"></div>
  </section>

  <section class="card">
    <h2>Queue</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Device</th><th class="hide-sm">Model</th><th class="hide-sm">Power</th><th>Version</th><th>Attempts</th><th></th></tr></thead>
      <tbody id="queue"></tbody>
    </table></div>
    <div id="queue-empty" class="empty">Nothing queued.</div>
  </section>

  <section class="card">
    <div class="toolbar">
      <h2 style="margin:0">Devices</h2>
      <input type="search" id="filter" placeholder="Filter by name, model or state…" oninput="render()">
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Device</th><th class="hide-sm">Model</th><th>State</th><th class="hide-sm">Version</th><th class="hide-sm">Last check</th><th>Note</th><th></th></tr></thead>
      <tbody id="devices"></tbody>
    </table></div>
  </section>

  <section class="card">
    <h2>Log</h2>
    <div class="log" id="log"></div>
  </section>

  <p class="muted" style="text-align:center">Z2M Auto Update <span id="version"></span></p>
</main>

<script>
let snap = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS_LABEL = { idle: 'Idle', queued: 'Queued', updating: 'Updating', paused: 'Paused', waiting_for_window: 'Waiting for window', offline: 'Zigbee2MQTT offline' };

function fmtDuration(s) {
  if (s == null) return '';
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000), now = Date.now();
  const diff = (now - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)} min ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} h ago`;
  return d.toLocaleString();
}
function fmtClock(ts) { return new Date(ts * 1000).toLocaleTimeString(); }
function version(d) {
  if (d.installed_version == null) return '';
  if (d.latest_version != null && d.latest_version !== d.installed_version) return `${d.installed_version} → ${d.latest_version}`;
  return String(d.installed_version);
}
function deviceState(d) {
  if (d.active) return ['updating', 'Updating'];
  if (d.skipped) return ['skipped', 'Skipped'];
  if (d.ineligible_reason && d.ineligible_reason.startsWith('gave up')) return ['failed', 'Gave up'];
  if (d.availability === 'offline') return ['offline', 'Offline'];
  if (d.update_state === 'available') return ['available', d.queued ? 'Queued' : 'Available'];
  if (d.update_state === 'idle') return ['idle', 'Up to date'];
  if (d.update_state === 'scheduled') return ['available', 'Scheduled'];
  return ['unknown', 'Unknown'];
}
function power(d) { return d.battery ? '🔋 battery' : '🔌 mains'; }

async function act(action, ieee) {
  try {
    const r = await fetch('api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ieee }) });
    if (!r.ok) throw new Error(await r.text());
    await refresh();
  } catch (e) { showError(e.message); }
}
function showError(msg) { const el = $('error'); el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }

async function refresh() {
  try {
    const r = await fetch('api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    snap = await r.json();
    showError('');
    render();
  } catch (e) { showError('Cannot reach the add-on: ' + e.message); }
}

function render() {
  if (!snap) return;
  const s = snap;
  const st = $('status'); st.className = 'pill ' + s.status; st.textContent = STATUS_LABEL[s.status] || s.status;
  $('btn-pause').style.display = s.paused ? 'none' : ''; $('btn-resume').style.display = s.paused ? '' : 'none';
  $('btn-run').disabled = s.run_now || s.paused;
  $('version').textContent = s.version || '';
  const byIeee = Object.fromEntries(s.devices.map(d => [d.ieee, d]));
  $('s-queue').textContent = s.queue.length;
  $('s-available').textContent = s.devices.filter(d => d.update_state === 'available').length;
  $('s-devices').textContent = s.devices.length;
  $('s-checks').textContent = s.checks_pending;
  $('s-window').textContent = s.window.start && s.window.end ? `${s.window.start}–${s.window.end}` : 'any time';

  const notes = [];
  if (!s.bridge_online) notes.push('Zigbee2MQTT is offline; waiting for it to come back.');
  if (s.paused) notes.push('Paused: no new updates will start until you resume.');
  if (s.status === 'waiting_for_window') notes.push(`Updates will start at ${s.window.start}. Press Run now to start immediately.`);
  if (s.run_now) notes.push('Run now is active: the update window is ignored until the queue is empty.');
  if (s.cooldown_remaining) notes.push(`Cooling down for ${s.cooldown_remaining}s before the next update.`);
  if (s.next_full_check_at) notes.push(`Next full update check in ${fmtDuration(Math.max(0, s.next_full_check_at - s.now))}.`);
  if (s.checks_in_flight && s.checks_in_flight.length) notes.push(`Waiting on a check response (${s.checks_in_flight[0].age}s).`);
  $('note').textContent = notes.join(' ');

  // Active
  const act = $('active');
  if (!s.active.length) { act.innerHTML = '<div class="empty">No update in progress.</div>'; }
  else act.innerHTML = s.active.map(a => `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <strong>${esc(a.friendly_name)}</strong>
        <span class="muted">${esc(a.vendor)} ${esc(a.model)} · ${power(a)} · ${a.external ? 'started elsewhere · ' : ''}running ${fmtDuration(a.elapsed)}</span>
      </div>
      <div class="progress"><div style="width:${a.progress != null ? a.progress : 0}%"></div></div>
      <div class="muted">${a.waiting_to_start ? 'Waiting for the device to start the download…' :
        `${a.progress != null ? a.progress.toFixed(1) + '%' : ''}${a.remaining != null ? ' · ' + fmtDuration(a.remaining) + ' remaining' : ''}`}
        ${version(a) ? ' · ' + version(a) : ''}</div>
    </div>`).join('');

  // Queue
  const q = s.queue.map(i => byIeee[i]).filter(Boolean);
  $('queue-empty').style.display = q.length ? 'none' : '';
  $('queue').innerHTML = q.map((d, i) => `<tr>
    <td class="num">${i + 1}</td>
    <td>${esc(d.friendly_name)}${d.priority ? ' <span class="pill available">priority</span>' : ''}</td>
    <td class="hide-sm muted">${esc(d.vendor)} ${esc(d.model)}</td>
    <td class="hide-sm">${power(d)}</td>
    <td class="num">${esc(version(d))}</td>
    <td class="num">${d.attempts}/${s.settings.max_attempts}</td>
    <td class="num">
      <button class="small" onclick="act('update','${esc(d.ieee)}')" title="Move to the front and start now">Update now</button>
      <button class="small" onclick="act('skip','${esc(d.ieee)}')">Skip</button>
    </td></tr>`).join('');

  // Devices
  const f = $('filter').value.trim().toLowerCase();
  const rows = s.devices.filter(d => {
    if (!f) return true;
    const [, label] = deviceState(d);
    return [d.friendly_name, d.vendor, d.model, label, d.ineligible_reason, d.last_error].some(x => x && String(x).toLowerCase().includes(f));
  });
  $('devices').innerHTML = rows.map(d => {
    const [cls, label] = deviceState(d);
    const note = d.last_error ? esc(d.last_error) : (d.ineligible_reason && d.update_state === 'available' ? esc(d.ineligible_reason) : '');
    const btns = [];
    if (!d.active) {
      btns.push(`<button class="small" onclick="act('check','${esc(d.ieee)}')" ${d.check_pending ? 'disabled' : ''}>Check</button>`);
      if (d.update_state === 'available') btns.push(`<button class="small" onclick="act('update','${esc(d.ieee)}')">Update now</button>`);
      btns.push(d.skipped ? `<button class="small" onclick="act('unskip','${esc(d.ieee)}')">Unskip</button>` : `<button class="small" onclick="act('skip','${esc(d.ieee)}')">Skip</button>`);
      if (d.attempts || d.last_error) btns.push(`<button class="small" onclick="act('retry','${esc(d.ieee)}')" title="Reset the failure count">Retry</button>`);
    }
    return `<tr>
      <td>${esc(d.friendly_name)}<div class="muted hide-sm" style="font-size:12px">${esc(d.description)}</div></td>
      <td class="hide-sm muted">${esc(d.vendor)} ${esc(d.model)}<br><span style="font-size:12px">${power(d)}</span></td>
      <td><span class="pill ${cls}">${label}</span>${d.check_pending ? ' <span class="muted" style="font-size:12px">checking…</span>' : ''}</td>
      <td class="hide-sm num">${esc(version(d))}</td>
      <td class="hide-sm num muted">${fmtTime(d.last_check_at)}</td>
      <td class="muted">${note}${d.last_result === 'success' && !d.last_error ? 'Updated ' + fmtTime(d.last_result_at) : ''}</td>
      <td class="num">${btns.join(' ')}</td></tr>`;
  }).join('');

  // Log
  $('log').innerHTML = s.events.slice(0, 200).map(e =>
    `<div class="${e.level}"><span class="muted">${fmtClock(e.ts)}</span> ${e.device ? '<strong>' + esc(e.device) + '</strong> ' : ''}${esc(e.message)}</div>`).join('') || '<div class="empty">Nothing yet.</div>';
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
