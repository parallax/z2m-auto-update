[project]
name = "z2m-auto-update"
version = "1.0.0"
description = "Queues Zigbee2MQTT OTA firmware updates so they run one at a time"
readme = "DOCS.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "aiomqtt>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
z2m-auto-update = "z2m_auto_update.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["z2m_auto_update*"]

[tool.setuptools.package-data]
z2m_auto_update = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
